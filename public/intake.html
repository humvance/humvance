<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ابدأ طلبك — Humvance</title>
<meta name="description" content="صف ما تلاحظه في منظمتك. يقرأ الطلب مختص بشري ويقرر الخطوة التالية. لا تشخيص آلي ولا تقييم تلقائي.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/hv.css">
<style>
  .ik-wrap { display: grid; grid-template-columns: 250px 1fr; gap: clamp(24px, 4vw, 56px); align-items: start;
             max-width: 1040px; margin-inline: auto; padding: clamp(24px, 4vw, 48px) var(--hv-5) var(--hv-9); }
  @media (max-width: 880px) { .ik-wrap { grid-template-columns: 1fr; gap: 20px; } .ik-rail { position: static !important; } }

  .ik-rail { position: sticky; top: 92px; }
  .ik-rail ol { display: grid; gap: 2px; }
  .ik-rail li { display: grid; grid-template-columns: 24px 1fr; gap: 11px; align-items: start;
                padding: 9px 10px; border-radius: var(--hv-r-sm); font-size: var(--hv-t-sm); color: var(--hv-ink-3); }
  .ik-rail li[data-state="current"] { background: var(--hv-signal-soft); color: var(--hv-signal); font-weight: 650; }
  .ik-rail li[data-state="done"] { color: var(--hv-ink-2); }
  .ik-dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor;
            display: grid; place-items: center; font-size: .68rem; font-family: var(--hv-font-en);
            font-weight: 700; opacity: .8; }
  .ik-rail li[data-state="done"] .ik-dot { background: var(--hv-verified); border-color: var(--hv-verified); color: #fff; opacity: 1; }
  @media (max-width: 880px) { .ik-rail ol { display: none; } }

  .ik-card { background: var(--hv-surface); border: 1px solid var(--hv-line); border-radius: var(--hv-r-lg); padding: clamp(20px, 3vw, 34px); }
  .ik-q { display: grid; gap: var(--hv-5); }
  .ik-optional { display: inline-flex; align-items: center; gap: 6px; font-size: var(--hv-t-xs);
                 color: var(--hv-ink-3); background: var(--hv-surface-2); border: 1px solid var(--hv-line);
                 padding: 3px 10px; border-radius: 999px; font-weight: 600; }
  .ik-actions { display: flex; align-items: center; justify-content: space-between; gap: var(--hv-3);
                margin-block-start: var(--hv-6); padding-block-start: var(--hv-5); border-block-start: 1px solid var(--hv-line); flex-wrap: wrap; }
  .ik-example { border: 1px solid var(--hv-line); border-radius: var(--hv-r); padding: var(--hv-4); display: grid; gap: var(--hv-3); background: var(--hv-surface-2); }
  .ik-chk { display: flex; gap: 11px; align-items: flex-start; padding: 11px 13px; border: 1.5px solid var(--hv-line);
            border-radius: var(--hv-r); background: var(--hv-surface); cursor: pointer; font-size: var(--hv-t-sm); }
  .ik-chk input { margin-block-start: 3px; accent-color: var(--hv-signal); width: 16px; height: 16px; flex: none; }
  .ik-chk:has(input:checked) { border-color: var(--hv-signal); background: var(--hv-signal-soft); }
  .ik-chk-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .ik-summary { display: grid; gap: 2px; font-size: var(--hv-t-sm); }
  .ik-summary-row { display: grid; grid-template-columns: 190px 1fr; gap: var(--hv-4); padding: 10px 0; border-block-start: 1px solid var(--hv-line); }
  .ik-summary-row:first-child { border-block-start: 0; }
  .ik-summary-k { color: var(--hv-ink-3); font-size: var(--hv-t-xs); }
  @media (max-width: 620px) { .ik-summary-row { grid-template-columns: 1fr; gap: 2px; } }
  .ik-rev { display: grid; gap: 14px; }
  .ik-rev-g { border: 1px solid var(--hv-line); border-radius: var(--hv-r); background: var(--hv-surface-2); padding: 14px 16px 6px; }
  .ik-rev-h { display: flex; align-items: center; justify-content: space-between; gap: var(--hv-3); flex-wrap: wrap;
              padding-block-end: 8px; }
  .ik-rev-g .ik-summary-row { grid-template-columns: 190px 1fr; }
  @media (max-width: 620px) { .ik-rev-g .ik-summary-row { grid-template-columns: 1fr; gap: 2px; } }
  .ik-rev-sub { font-size: var(--hv-t-xs); color: var(--hv-ink-3); margin-block: 8px 2px; }
  .ik-rev-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ik-rev-chip { font-size: var(--hv-t-xs); background: var(--hv-surface); border: 1px solid var(--hv-line);
                 border-radius: 999px; padding: 3px 10px; }
  .ik-done { max-width: 620px; margin: clamp(40px, 8vw, 96px) auto; padding-inline: var(--hv-5); text-align: center; }
  .ik-tick { width: 54px; height: 54px; border-radius: 50%; background: var(--hv-verified-soft);
             color: var(--hv-verified); display: grid; place-items: center; margin: 0 auto var(--hv-5); border: 1px solid var(--hv-verified-line); }
  .ik-ref { font-family: var(--hv-font-mono); direction: ltr; unicode-bidi: isolate; font-size: 1.15rem; font-weight: 700;
            letter-spacing: .06em; background: var(--hv-surface-2); border: 1px dashed var(--hv-line-2);
            border-radius: var(--hv-r); padding: 14px 20px; display: inline-block; margin-block: var(--hv-4); }
</style>
</head>
<body data-lang="ar">
<a class="hv-skip" href="#main" data-hv-t="a11y.skip">تخطَّ إلى المحتوى</a>
<div id="app"></div>

<script src="/assets/hv-i18n.js"></script>
<script src="/assets/hv-icons.js"></script>
<script src="/assets/hv-copy.js"></script>
<script src="/assets/hv-ui.js"></script>
<script src="/assets/hv-intake-copy.js"></script>
<script>
/* ===========================================================================
   Start a request — the anonymous intake.
   ---------------------------------------------------------------------------
   WHAT DID NOT CHANGE: the wire contract. This form posts exactly once, to
   POST /api/v2/intake, with exactly the keys api/v2/_intake.js allows, and it
   sends nothing the server would reject. The payload builder below is the
   existing one, preserved deliberately. No backend change was needed and none
   is proposed.

   WHAT CHANGED: the shape of the conversation. The old form asked for company
   details first and the problem eleventh. This one asks what you are seeing in
   the first question, because that is what the visitor came to say, and leaves
   the administrative fields until the end when they are already invested.

   Required by the server, and therefore required here — eight things:
     company_name · respondent name · role_title · email · case_intent
     reported_situation · scope.kind · timeline.pattern · desired_outcome
     and the three consent acknowledgements.
   Everything else is genuinely optional and is labelled as such. Nothing is
   fabricated on the visitor's behalf, and nothing required is silently dropped.

   THE RECEIPT SAYS "RECEIVED". It does not say created, assessed, scored or
   accepted, because none of those has happened.
   =========================================================================== */
(function () {
  'use strict';
  var I = HV.i18n, U = HV.ui, ic = HVIcons.icon, t = I.t, esc = I.esc;
  var DRAFT_KEY = 'hv_intake_draft';

  /* ── State. Everything the visitor types lives here, never only in the DOM,
        which is what makes a language switch free. ── */
  var S = {
    view: 'form', step: 0, sending: false, result: null, errors: {}, showErrors: false,
    /* Set when the visitor jumps back from the review to fix one section, so
       the step they land on can offer a direct way back. Not persisted: a
       restored draft starts clean. */
    returnToReview: false,
    d: {
      reported_situation: '', case_intent: '',
      scope_kind: '', scope_labels: '',
      pattern: '', first_noticed_approx: '', associated_change_note: '',
      examples: [{ what_happened: '', approx_when: '', area: '', observable_consequence: '' }],
      impact: {}, changes: {}, availability: {},
      desired_outcome: '', client_belief: '',
      company_name: '', sector: '', employee_count_band: '', growth_stage: '',
      name: '', role_title: '', email: '', phone: '', preferred_contact: '',
      consent_data_use: false, consent_ai: false, consent_sensitive: false
    }
  };

  /* Draft persistence is disclosed on the page, and clearable from it. It never
     leaves this browser. */
  function saveDraft() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ step: S.step, d: S.d })); } catch (e) {}
  }
  function loadDraft() {
    try {
      var raw = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
      if (raw && raw.d) { Object.assign(S.d, raw.d); S.step = Math.min(raw.step || 0, 5); return true; }
    } catch (e) {}
    return false;
  }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

  /* ── Steps ── */
  var STEPS = ['s.situation', 's.where', 's.examples', 's.outcome', 's.about', 's.consent'];
  var OPTIONAL_STEPS = { 2: true };

  /* ── Validation ─────────────────────────────────────────────────────────────
     Mirrors the server's required set exactly — no more, no less.

     CORRECTED 2026-09-18. `S.errors` used to hold TRANSLATED SENTENCES. Switching
     language re-rendered the page but not the strings already captured, so the
     visitor saw English errors on an Arabic form — and because nothing
     re-validated, fields they had already corrected stayed marked invalid.

     It now holds KEYS. The message is translated at render time, so it is always
     in the language on screen, and `revalidateField` clears a field the moment
     its value becomes valid, without disturbing fields the visitor has not
     touched and without a full re-render that would steal focus. */
  function validate(step) {
    var d = S.d, e = {};
    if (step === 0) {
      if (!d.reported_situation.trim()) e.reported_situation = 'v.required';
      else if (d.reported_situation.length > 5000) e.reported_situation = 'v.tooLong';
      if (!d.case_intent) e.case_intent = 'v.pickOne';
    }
    if (step === 1) {
      if (!d.scope_kind) e.scope_kind = 'v.pickOne';
      if (!d.pattern) e.pattern = 'v.pickOne';
    }
    if (step === 3) {
      if (!d.desired_outcome.trim()) e.desired_outcome = 'v.required';
      else if (d.desired_outcome.length > 2000) e.desired_outcome = 'v.tooLong';
    }
    if (step === 4) {
      if (!d.company_name.trim()) e.company_name = 'v.required';
      if (!d.name.trim()) e.name = 'v.required';
      if (!d.role_title.trim()) e.role_title = 'v.required';
      if (!d.email.trim()) e.email = 'v.required';
      else if (!/^[^\s@]{1,64}@[^\s@.]+(\.[^\s@.]+)+$/.test(d.email.trim())) e.email = 'v.email';
    }
    if (step === 5) {
      if (!(d.consent_data_use && d.consent_ai && d.consent_sensitive)) e.consent = 'v.consent';
    }
    S.errors = e;
    return Object.keys(e).length === 0;
  }

  /** The message for a field, in the language on screen right now. */
  function errText(key) { return S.errors[key] ? t(S.errors[key]) : ''; }

  /**
   * Re-check one field after the visitor has changed it, and clear its error in
   * place if it is now valid. Only fields that are ALREADY flagged are touched:
   * a field nobody has filled in yet must not sprout an error while they are
   * still typing somewhere else.
   */
  function revalidateField(key) {
    if (!S.showErrors || !(key in S.errors)) return;
    var before = S.errors[key];
    validate(S.step);
    var after = S.errors[key];
    if (after === before) return;

    var box = document.getElementById('e-' + key);
    var input = document.getElementById('f-' + key) || document.querySelector('[name="' + key + '"]');
    if (!after) {
      if (box) box.innerHTML = '';
      if (input) input.removeAttribute('aria-invalid');
    } else if (box) {
      box.innerHTML = U.fieldError(t(after));
      if (input) input.setAttribute('aria-invalid', 'true');
    }
    var summary = document.getElementById('ik-error-summary');
    if (summary && !Object.keys(S.errors).length) summary.innerHTML = '';
  }

  /* ── Payload. Preserved from the working implementation, unchanged in shape. ── */
  function payload() {
    var d = S.d;
    function collect(bag, extra) {
      return Object.keys(bag).filter(function (k) { return bag[k] && bag[k].on; })
        .map(function (k) { return extra(k, bag[k]); });
    }
    return {
      organization_context: {
        company_name: d.company_name.trim(),
        sector: d.sector.trim() || undefined,
        employee_count_band: d.employee_count_band || undefined,
        growth_stage: d.growth_stage || undefined
      },
      respondent_context: {
        name: d.name.trim(), role_title: d.role_title.trim(), email: d.email.trim(),
        phone: d.phone.trim() || undefined, preferred_contact: d.preferred_contact || undefined
      },
      case_intent: d.case_intent,
      reported_situation: d.reported_situation.trim(),
      scope: {
        kind: d.scope_kind,
        labels: d.scope_labels.split(',').map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 10)
      },
      timeline: {
        first_noticed_approx: d.first_noticed_approx.trim() || undefined,
        pattern: d.pattern,
        associated_change_note: d.associated_change_note.trim() || undefined
      },
      recent_examples: d.examples.filter(function (x) { return x.what_happened.trim(); }).slice(0, 3).map(function (x) {
        return {
          what_happened: x.what_happened.trim(),
          approx_when: x.approx_when.trim() || undefined,
          area: x.area.trim() || undefined,
          observable_consequence: x.observable_consequence.trim() || undefined
        };
      }),
      observed_impact: collect(d.impact, function (kind, v) {
        var row = { kind: kind, description: (v.description || '').trim() || undefined };
        var n = parseFloat(v.value);
        if (isFinite(n) && (v.unit || '').trim()) {
          row.quantification = { value: n, unit: v.unit.trim(), basis: (v.basis || '').trim() || undefined };
        }
        return row;
      }),
      change_context: collect(d.changes, function (kind, v) { return { kind: kind, note: (v.note || '').trim() || undefined }; }),
      client_belief: d.client_belief.trim() || undefined,
      evidence_availability: collect(d.availability, function (kind, v) { return { kind: kind, note: (v.note || '').trim() || undefined }; }),
      desired_outcome: d.desired_outcome.trim(),
      consent: { data_use: !!d.consent_data_use, ai_transparency_ack: !!d.consent_ai, sensitive_data_ack: !!d.consent_sensitive },
      locale: I.lang
    };
  }

  /* ── Field builders ── */

  function invalid(key) { return S.showErrors && S.errors[key] ? ' aria-invalid="true" aria-describedby="e-' + key + '"' : ''; }
  /* The error node always exists, so clearing an error in place needs no
     re-render — which is what keeps the caret where the visitor left it. */
  function errWrap(key) {
    return '<div id="e-' + key + '">' +
      (S.showErrors && S.errors[key] ? U.fieldError(errText(key)) : '') + '</div>';
  }

  function textarea(key, label, help, max, required) {
    return '<div class="hv-field">' +
      '<label class="hv-label" for="f-' + key + '">' + esc(label) + (required ? '<span class="hv-req">*</span>' : '') + '</label>' +
      (help ? '<p class="hv-help">' + esc(help) + '</p>' : '') +
      '<textarea class="hv-textarea" id="f-' + key + '" data-hv-keep="' + key + '"' + invalid(key) + '>' + esc(S.d[key]) + '</textarea>' +
      '<div class="hv-counter" data-hv-count-for="f-' + key + '" data-hv-max="' + max + '"></div>' +
      errWrap(key) + '</div>';
  }

  function input(key, label, opts) {
    opts = opts || {};
    return '<div class="hv-field">' +
      '<label class="hv-label" for="f-' + key + '">' + esc(label) +
        (opts.required ? '<span class="hv-req">*</span>' : ' <span class="ik-optional">' + esc(t('common.optional')) + '</span>') +
      '</label>' +
      (opts.help ? '<p class="hv-help">' + esc(opts.help) + '</p>' : '') +
      '<input class="hv-input' + (opts.ltr ? ' hv-ltr' : '') + '" id="f-' + key + '" type="' + (opts.type || 'text') + '" ' +
        'data-hv-keep="' + key + '" value="' + esc(S.d[key]) + '"' +
        (opts.autocomplete ? ' autocomplete="' + opts.autocomplete + '"' : '') + invalid(key) + '>' +
      errWrap(key) + '</div>';
  }

  function select(key, label, options, required) {
    return '<div class="hv-field">' +
      '<label class="hv-label" for="f-' + key + '">' + esc(label) +
        (required ? '<span class="hv-req">*</span>' : ' <span class="ik-optional">' + esc(t('common.optional')) + '</span>') + '</label>' +
      '<select class="hv-select" id="f-' + key + '" data-hv-keep="' + key + '"' + invalid(key) + '>' +
        '<option value="">' + esc(t('f.choose')) + '</option>' +
        options.map(function (o) {
          return '<option value="' + esc(o) + '"' + (S.d[key] === o ? ' selected' : '') + '>' + esc(t('o.' + key + '.' + o)) + '</option>';
        }).join('') +
      '</select>' + errWrap(key) + '</div>';
  }

  function radios(key, label, options, help) {
    return '<fieldset class="hv-field" style="border:0">' +
      '<legend class="hv-label" style="padding:0">' + esc(label) + '<span class="hv-req">*</span></legend>' +
      (help ? '<p class="hv-help" style="margin-block:4px 8px">' + esc(help) + '</p>' : '') +
      '<div class="hv-choices">' + options.map(function (o) {
        return '<label class="hv-choice"><input type="radio" name="' + key + '" value="' + esc(o) + '" ' +
          'data-hv-keep="' + key + '"' + (S.d[key] === o ? ' checked' : '') + '>' +
          '<span><span class="hv-choice-title">' + esc(t('o.' + key + '.' + o)) + '</span>' +
          (I.has('o.' + key + '.' + o + '.d')
            ? '<span class="hv-choice-desc">' + esc(t('o.' + key + '.' + o + '.d')) + '</span>' : '') +
          '</span></label>';
      }).join('') + '</div>' + errWrap(key) + '</fieldset>';
  }

  function checkGroup(bag, options, prefix) {
    return '<div class="ik-chk-grid">' + options.map(function (o) {
      var on = S.d[bag][o] && S.d[bag][o].on;
      return '<label class="ik-chk"><input type="checkbox" data-hv-bag="' + bag + '" value="' + esc(o) + '"' +
        (on ? ' checked' : '') + '><span>' + esc(t(prefix + '.' + o)) + '</span></label>';
    }).join('') + '</div>';
  }

  /* ── Steps ── */

  var INTENTS = ['DYSFUNCTION', 'RISK', 'OPPORTUNITY'];
  var SCOPES = ['company_wide', 'function', 'team', 'process', 'multiple_areas', 'unsure'];
  var PATTERNS = ['persistent', 'intermittent', 'increasing', 'decreasing', 'unclear'];
  var BANDS = ['1-10', '11-50', '51-200', '201-500', '501-1000', '1000+', 'unsure'];
  var STAGES = ['early', 'growing', 'scaling', 'stable', 'restructuring', 'unsure'];
  var CONTACTS = ['email', 'phone', 'whatsapp'];
  var IMPACTS = ['delays', 'additional_cost', 'lost_revenue', 'workload', 'customer_impact',
                 'turnover', 'quality_rework', 'management_time', 'growth_constraint', 'compliance_risk', 'other'];
  var CHANGES = ['rapid_growth', 'leadership_change', 'new_system', 'restructuring', 'acquisition',
                 'new_product', 'headcount_change', 'policy_process_change', 'customer_volume_change', 'no_known_change', 'other'];
  var AVAIL = ['org_chart', 'policies_procedures', 'delegation_matrix', 'workflow_system_data', 'kpi_reports',
               'operational_reports', 'financial_reports', 'survey_results', 'workforce_data', 'meeting_decision_records', 'other', 'unsure'];

  function stepBody(n) {
    var d = S.d;
    if (n === 0) return '<div class="ik-q">' +
      textarea('reported_situation', t('q.situation'), t('q.situation.help'), 5000, true) +
      radios('case_intent', t('q.intent'), INTENTS, t('q.intent.help')) +
      '</div>';

    if (n === 1) return '<div class="ik-q">' +
      radios('scope_kind', t('q.scope'), SCOPES) +
      input('scope_labels', t('q.scopeLabels'), { help: t('q.scopeLabels.help') }) +
      radios('pattern', t('q.pattern'), PATTERNS) +
      input('first_noticed_approx', t('q.firstNoticed'), { help: t('q.firstNoticed.help') }) +
      input('associated_change_note', t('q.assocChange'), { help: t('q.assocChange.help') }) +
      '</div>';

    if (n === 2) {
      var ex = d.examples.map(function (x, i) {
        return '<div class="ik-example">' +
          '<div class="hv-row-between"><strong class="hv-sm">' + esc(t('q.example')) + ' ' + I.num(i + 1) + '</strong>' +
            (d.examples.length > 1 ? '<button class="hv-btn hv-btn-ghost hv-btn-sm" type="button" data-hv-rm-ex="' + i + '">' +
              ic('close', { size: 14 }) + esc(t('q.removeExample')) + '</button>' : '') + '</div>' +
          '<div class="hv-field"><label class="hv-label" for="ex-w-' + i + '">' + esc(t('q.whatHappened')) + '</label>' +
            '<textarea class="hv-textarea" style="min-height:96px" id="ex-w-' + i + '" data-hv-ex="' + i + '|what_happened">' + esc(x.what_happened) + '</textarea></div>' +
          '<div class="hv-row" style="gap:12px;align-items:flex-start">' +
            '<div class="hv-field" style="flex:1;min-width:150px"><label class="hv-label" for="ex-t-' + i + '">' + esc(t('q.approxWhen')) + '</label>' +
              '<input class="hv-input" id="ex-t-' + i + '" data-hv-ex="' + i + '|approx_when" value="' + esc(x.approx_when) + '"></div>' +
            '<div class="hv-field" style="flex:1;min-width:150px"><label class="hv-label" for="ex-a-' + i + '">' + esc(t('q.area')) + '</label>' +
              '<input class="hv-input" id="ex-a-' + i + '" data-hv-ex="' + i + '|area" value="' + esc(x.area) + '"></div>' +
          '</div>' +
          '<div class="hv-field"><label class="hv-label" for="ex-c-' + i + '">' + esc(t('q.consequence')) + '</label>' +
            '<input class="hv-input" id="ex-c-' + i + '" data-hv-ex="' + i + '|observable_consequence" value="' + esc(x.observable_consequence) + '"></div>' +
          '</div>';
      }).join('');

      return '<div class="ik-q">' +
        '<div>' + U.note('signal', esc(t('q.examples.why')), 'info') + '</div>' +
        '<div class="hv-field"><span class="hv-label">' + esc(t('q.examples')) + '</span>' +
          '<p class="hv-help">' + esc(t('q.examples.help')) + '</p>' +
          '<div style="display:grid;gap:12px;margin-block-start:8px">' + ex + '</div>' +
          (d.examples.length < 3 ? '<div style="margin-block-start:10px"><button class="hv-btn hv-btn-outline hv-btn-sm" type="button" data-hv-add-ex>' +
            ic('plus', { size: 14 }) + esc(t('q.addExample')) + '</button></div>' : '') +
        '</div>' +
        '<div class="hv-field"><span class="hv-label">' + esc(t('q.impact')) + '</span>' +
          '<p class="hv-help">' + esc(t('q.impact.help')) + '</p>' + checkGroup('impact', IMPACTS, 'o.impact') + '</div>' +
        '</div>';
    }

    if (n === 3) return '<div class="ik-q">' +
      textarea('desired_outcome', t('q.outcome'), t('q.outcome.help'), 2000, true) +
      textarea('client_belief', t('q.belief'), t('q.belief.help'), 2000, false) +
      '<div>' + U.note('caution', esc(t('q.belief.note')), 'info') + '</div>' +
      '<div class="hv-field"><span class="hv-label">' + esc(t('q.changes')) + ' <span class="ik-optional">' + esc(t('common.optional')) + '</span></span>' +
        '<p class="hv-help">' + esc(t('q.changes.help')) + '</p>' + checkGroup('changes', CHANGES, 'o.change') + '</div>' +
      '<div class="hv-field"><span class="hv-label">' + esc(t('q.avail')) + ' <span class="ik-optional">' + esc(t('common.optional')) + '</span></span>' +
        '<p class="hv-help">' + esc(t('q.avail.help')) + '</p>' + checkGroup('availability', AVAIL, 'o.avail') + '</div>' +
      '</div>';

    if (n === 4) return '<div class="ik-q">' +
      input('company_name', t('q.company'), { required: true, autocomplete: 'organization' }) +
      input('sector', t('q.sector')) +
      '<div class="hv-row" style="gap:16px;align-items:flex-start">' +
        '<div style="flex:1;min-width:180px">' + select('employee_count_band', t('q.band'), BANDS) + '</div>' +
        '<div style="flex:1;min-width:180px">' + select('growth_stage', t('q.stage'), STAGES) + '</div>' +
      '</div>' +
      '<hr class="hv-divider">' +
      '<p class="hv-sm hv-muted">' + esc(t('q.you.help')) + '</p>' +
      input('name', t('q.name'), { required: true, autocomplete: 'name' }) +
      input('role_title', t('q.role'), { required: true, autocomplete: 'organization-title' }) +
      input('email', t('q.email'), { required: true, type: 'email', ltr: true, autocomplete: 'email' }) +
      input('phone', t('q.phone'), { type: 'tel', ltr: true, autocomplete: 'tel' }) +
      select('preferred_contact', t('q.contactPref'), CONTACTS) +
      '</div>';

    /* 5 — review and consent */
    return '<div class="ik-q">' +
      '<div><h3 class="hv-h3" style="font-size:1.05rem;margin-block-end:4px">' + esc(t('q.review')) + '</h3>' +
        '<p class="hv-sm hv-muted" style="margin-block-end:14px">' + esc(t('q.review.sub')) + '</p>' +
        reviewGroups() + '</div>' +

      '<div class="hv-field"><span class="hv-label">' + esc(t('q.consent')) + '<span class="hv-req">*</span></span>' +
        '<div style="display:grid;gap:10px;margin-block-start:8px">' +
          consentBox('consent_data_use', t('c.dataUse')) +
          consentBox('consent_ai', t('c.ai')) +
          consentBox('consent_sensitive', t('c.sensitive')) +
        '</div>' + errWrap('consent') + '</div>' +

      '<div>' + U.note('signal', esc(t('q.beforeSend')), 'shield') + '</div>' +
      '</div>';
  }

  /* ── The review ──────────────────────────────────────────────────────────────
     CORRECTED 2026-09-18. The review used to show SEVEN values out of the
     thirty-odd a visitor can supply. Somebody who had spent ten minutes writing
     three examples, picking impact areas and naming what evidence they could
     find saw none of it again, and had no way to check or correct it without
     walking backwards through the form.

     It now shows every answer that is not empty, grouped by the step it came
     from, and each group carries an edit action that jumps straight to that
     step. Editing is a navigation, not a reset: `capture()` runs first, so the
     acknowledgements ticked on this step and everything else in `S.d` survive
     the jump, and the draft is saved before the move.

     Empty OPTIONAL groups are still listed — with a line saying nothing was
     added — because a visitor should be able to see that a section exists and
     go back to it. Nothing here changes what is sent: `payload()` is untouched.
     ───────────────────────────────────────────────────────────────────────── */

  function revRow(label, value, opts) {
    if (value === undefined || value === null || value === '') return '';
    var body = (opts && opts.html) ? value : esc(value);
    return '<div class="ik-summary-row"><div class="ik-summary-k">' + esc(label) + '</div>' +
      '<div style="white-space:pre-wrap">' + body + '</div></div>';
  }
  function revChips(label, items) {
    if (!items.length) return '';
    return '<div class="ik-summary-row"><div class="ik-summary-k">' + esc(label) + '</div>' +
      '<div class="ik-rev-chips">' + items.map(function (s) {
        return '<span class="ik-rev-chip">' + esc(s) + '</span>';
      }).join('') + '</div></div>';
  }
  /** Selected keys of a checkbox bag, as readable labels, with any note kept. */
  function revBag(bag, prefix) {
    var v = S.d[bag];
    return Object.keys(v).filter(function (k) { return v[k] && v[k].on; })
      .map(function (k) {
        var note = (v[k].note || v[k].description || '').trim();
        return t(prefix + '.' + k) + (note ? ' — ' + note : '');
      });
  }
  function revOpt(key, val) { return val ? t('o.' + key + '.' + val) : ''; }

  function reviewGroups() {
    var d = S.d;

    var groups = [
      { step: 0, title: t('s.situation'), rows:
          revRow(t('q.intent'), revOpt('case_intent', d.case_intent)) +
          revRow(t('q.situation'), d.reported_situation.trim()) },

      { step: 1, title: t('s.where'), rows:
          revRow(t('q.scope'), revOpt('scope_kind', d.scope_kind)) +
          revChips(t('q.review.labels'), d.scope_labels.split(',').map(function (s) { return s.trim(); })
            .filter(Boolean).slice(0, 10)) +
          revRow(t('q.pattern'), revOpt('pattern', d.pattern)) +
          revRow(t('q.firstNoticed'), d.first_noticed_approx.trim()) +
          revRow(t('q.assocChange'), d.associated_change_note.trim()) },

      { step: 2, optional: true, title: t('s.examples'), rows:
          d.examples.filter(function (x) { return x.what_happened.trim(); }).slice(0, 3)
            .map(function (x, i) {
              return '<div class="ik-rev-sub">' + esc(t('q.example')) + ' ' + I.num(i + 1) + '</div>' +
                revRow(t('q.whatHappened'), x.what_happened.trim()) +
                revRow(t('q.approxWhen'), x.approx_when.trim()) +
                revRow(t('q.area'), x.area.trim()) +
                revRow(t('q.consequence'), x.observable_consequence.trim());
            }).join('') +
          revChips(t('q.review.impact'), revBag('impact', 'o.impact')) },

      { step: 3, title: t('s.outcome'), rows:
          revRow(t('q.outcome'), d.desired_outcome.trim()) +
          revRow(t('q.belief'), d.client_belief.trim()) +
          revChips(t('q.review.changes'), revBag('changes', 'o.change')) +
          revChips(t('q.review.avail'), revBag('availability', 'o.avail')) },

      { step: 4, title: t('s.about'), rows:
          revRow(t('q.company'), d.company_name.trim()) +
          revRow(t('q.sector'), d.sector.trim()) +
          revRow(t('q.band'), revOpt('employee_count_band', d.employee_count_band)) +
          revRow(t('q.stage'), revOpt('growth_stage', d.growth_stage)) +
          revRow(t('q.name'), d.name.trim()) +
          revRow(t('q.role'), d.role_title.trim()) +
          revRow(t('q.email'), d.email.trim() ? I.mail(d.email.trim()) : '', { html: true }) +
          revRow(t('q.phone'), d.phone.trim() ? I.code(d.phone.trim()) : '', { html: true }) +
          revRow(t('q.contactPref'), revOpt('preferred_contact', d.preferred_contact)) }
    ];

    return '<div class="ik-rev">' + groups.map(function (g) {
      if (!g.rows && !g.optional) return '';
      return '<section class="ik-rev-g">' +
        '<div class="ik-rev-h"><strong class="hv-sm">' + esc(g.title) + '</strong>' +
          '<button class="hv-btn hv-btn-ghost hv-btn-sm" type="button" data-hv-edit="' + g.step + '" ' +
            'aria-label="' + esc(t('q.review.editA', { section: g.title })) + '">' +
            ic('edit', { size: 13 }) + esc(t('q.review.edit')) + '</button></div>' +
        (g.rows
          ? '<div class="ik-summary">' + g.rows + '</div>'
          : '<p class="hv-xs hv-muted" style="padding-block-end:10px">' + esc(t('q.review.none')) + '</p>') +
        '</section>';
    }).join('') + '</div>';
  }

  function consentBox(key, text) {
    return '<label class="hv-consent" style="display:flex;gap:12px;align-items:flex-start;cursor:pointer">' +
      '<input type="checkbox" data-hv-keep="' + key + '" style="margin-block-start:3px;width:17px;height:17px;accent-color:var(--hv-signal);flex:none"' +
      (S.d[key] ? ' checked' : '') + '>' +
      '<span class="hv-sm" style="line-height:1.7">' + esc(text) + '</span></label>';
  }

  /* ── Render ── */

  function rail() {
    return '<aside class="ik-rail">' +
      '<div class="hv-progress" style="margin-block-end:18px">' +
        '<div class="hv-row-between hv-xs hv-muted"><span>' + esc(t('f.step')) + ' <bdi class="hv-num">' + (S.step + 1) + ' / ' + STEPS.length + '</bdi></span>' +
          '<span><bdi class="hv-num">' + Math.round((S.step / STEPS.length) * 100) + '%</bdi></span></div>' +
        '<div class="hv-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="' + STEPS.length + '" aria-valuenow="' + (S.step + 1) + '" aria-label="' + esc(t('f.progress')) + '">' +
          '<div class="hv-progress-fill" style="width:' + Math.round(((S.step) / STEPS.length) * 100) + '%"></div></div>' +
      '</div>' +
      '<ol>' + STEPS.map(function (k, i) {
        var state = i === S.step ? 'current' : (i < S.step ? 'done' : 'todo');
        return '<li data-state="' + state + '">' +
          '<span class="ik-dot">' + (state === 'done' ? ic('check', { size: 12 }) : I.num(i + 1)) + '</span>' +
          '<span>' + esc(t(k)) + (OPTIONAL_STEPS[i] ? ' <span class="hv-xs hv-muted">(' + esc(t('common.optional')) + ')</span>' : '') + '</span></li>';
      }).join('') + '</ol>' +
      '<div class="hv-xs hv-muted" style="margin-block-start:18px;line-height:1.7">' +
        ic('lock', { size: 13 }) + ' ' + esc(t('f.draftNote')) +
        ' <button class="hv-btn hv-btn-ghost hv-btn-sm" type="button" data-hv-clear style="padding:2px 6px;font-size:.75rem;text-decoration:underline">' + esc(t('f.clearDraft')) + '</button>' +
      '</div></aside>';
  }

  function form() {
    var last = S.step === STEPS.length - 1;
    return '<div class="ik-wrap">' + rail() +
      '<div>' +
        '<div class="ik-card">' +
          '<div class="hv-row" style="gap:10px;margin-block-end:6px">' +
            '<h1 class="hv-h3" style="margin:0">' + esc(t(STEPS[S.step])) + '</h1>' +
            (OPTIONAL_STEPS[S.step] ? '<span class="ik-optional">' + esc(t('f.optionalStep')) + '</span>' : '') +
          '</div>' +
          '<p class="hv-sm hv-muted" style="margin-block-end:22px">' + esc(t(STEPS[S.step] + '.sub')) + '</p>' +
          '<div id="ik-error-summary">' +
            (S.showErrors && Object.keys(S.errors).length
              ? '<div style="margin-block-end:18px">' + U.note('conflict', esc(t('v.summary')), 'alert') + '</div>' : '') +
          '</div>' +
          '<form id="ik-form" novalidate>' + stepBody(S.step) + '</form>' +
          '<div class="ik-actions">' +
            (S.step > 0
              ? '<button class="hv-btn hv-btn-ghost" type="button" data-hv-back>' + ic('arrowBack', { size: 16 }) + esc(t('common.back')) + '</button>'
              : '<a class="hv-btn hv-btn-ghost" href="/">' + ic('arrowBack', { size: 16 }) + esc(t('f.leave')) + '</a>') +
            '<div class="hv-row" style="gap:10px">' +
              (OPTIONAL_STEPS[S.step] ? '<button class="hv-btn hv-btn-ghost" type="button" data-hv-skip>' + esc(t('f.skip')) + '</button>' : '') +
              /* Only after an edit jump: a way back to the review that does not
                 require clicking Next through every step in between. */
              (S.returnToReview && !last
                ? '<button class="hv-btn hv-btn-outline" type="button" data-hv-to-review>' +
                  esc(t('f.toReview')) + ic('arrow', { size: 15 }) + '</button>' : '') +
              (last
                ? '<button class="hv-btn hv-btn-signal hv-btn-lg" type="button" data-hv-submit' + (S.sending ? ' disabled' : '') + '>' +
                  (S.sending ? esc(t('f.sending')) : esc(t('f.send')) + ic('arrow', { size: 16 })) + '</button>'
                : '<button class="hv-btn hv-btn-primary" type="button" data-hv-next>' + esc(t('common.next')) + ic('arrow', { size: 16 }) + '</button>') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<p class="hv-xs hv-muted" style="margin-block-start:16px;display:flex;gap:8px;align-items:flex-start;max-width:60ch">' +
          ic('shield', { size: 14 }) + '<span>' + esc(t('f.privacyFoot')) + '</span></p>' +
      '</div></div>';
  }

  function done() {
    var ref = S.result && S.result.submission_reference;
    return '<div class="ik-done">' +
      '<div class="ik-tick">' + ic('check', { size: 26 }) + '</div>' +
      '<h1 class="hv-h2">' + esc(t('done.title')) + '</h1>' +
      '<p class="hv-lead" style="margin-block-start:14px">' + esc(t('done.body')) + '</p>' +
      (ref ? '<div class="ik-ref">' + esc(ref) + '</div>' +
        '<p class="hv-xs hv-muted">' + esc(t('done.refNote')) + '</p>' : '') +
      '<div style="margin-block-start:26px;text-align:start">' + U.note('signal', esc(t('done.notDiagnosis')), 'shield') + '</div>' +
      '<div class="hv-row" style="justify-content:center;gap:12px;margin-block-start:26px">' +
        '<a class="hv-btn hv-btn-outline" href="/">' + esc(t('done.home')) + '</a>' +
        '<a class="hv-btn hv-btn-ghost" href="/how-we-work">' + esc(t('done.whatNext')) + '</a>' +
      '</div></div>';
  }

  function render(keepScroll) {
    document.title = (I.isAr() ? 'ابدأ طلبك' : 'Start a request') + ' — Humvance';
    document.getElementById('app').innerHTML =
      U.demoBar() + U.siteHeader() + '<main id="main">' + (S.view === 'done' ? done() : form()) + '</main>' + U.siteFooter();
    U.wire();
    wireForm();
    if (!keepScroll) window.scrollTo(0, 0);
  }

  /* Harvest anything typed but not yet in state, so a re-render never loses it. */
  function capture() {
    var live = I.captureLiveFields();
    Object.keys(live).forEach(function (k) { if (k in S.d) S.d[k] = live[k]; });
    document.querySelectorAll('[data-hv-ex]').forEach(function (el) {
      var p = el.getAttribute('data-hv-ex').split('|');
      var i = Number(p[0]);
      if (S.d.examples[i]) S.d.examples[i][p[1]] = el.value;
    });
    saveDraft();
  }

  function wireForm() {
    var app = document.getElementById('app');

    app.querySelectorAll('[data-hv-keep], [data-hv-ex]').forEach(function (el) {
      var key = el.getAttribute('data-hv-keep') || el.name;
      el.addEventListener('change', function () {
        capture();
        revalidateField(key);
        if (/^consent_/.test(key)) revalidateField('consent');
      });
      if (el.tagName === 'TEXTAREA' || el.type === 'text' || el.type === 'email' || el.type === 'tel') {
        /* On blur, not on every keystroke: correcting one field must not make
           the form shout about a field the visitor has not reached yet. */
        el.addEventListener('blur', function () { capture(); revalidateField(key); });
      }
    });

    app.querySelectorAll('[data-hv-bag]').forEach(function (el) {
      el.addEventListener('change', function () {
        var bag = el.getAttribute('data-hv-bag'), k = el.value;
        if (!S.d[bag][k]) S.d[bag][k] = {};
        S.d[bag][k].on = el.checked;
        saveDraft();
      });
    });

    var on = function (sel, fn) { var e = app.querySelector(sel); if (e) e.addEventListener('click', fn); };

    on('[data-hv-next]', function () {
      capture();
      S.showErrors = true;
      if (!validate(S.step)) { render(true); focusFirstError(); return; }
      S.showErrors = false; S.step++; saveDraft(); render();
    });
    on('[data-hv-skip]', function () { capture(); S.showErrors = false; S.step++; saveDraft(); render(); });
    on('[data-hv-back]', function () { capture(); S.showErrors = false; S.step--; saveDraft(); render(); });
    on('[data-hv-add-ex]', function () {
      capture();
      if (S.d.examples.length < 3) S.d.examples.push({ what_happened: '', approx_when: '', area: '', observable_consequence: '' });
      render(true);
    });
    on('[data-hv-clear]', function () {
      if (!confirm(t('f.clearConfirm'))) return;
      clearDraft(); location.reload();
    });
    app.querySelectorAll('[data-hv-rm-ex]').forEach(function (b) {
      b.addEventListener('click', function () {
        capture();
        S.d.examples.splice(Number(b.getAttribute('data-hv-rm-ex')), 1);
        if (!S.d.examples.length) S.d.examples.push({ what_happened: '', approx_when: '', area: '', observable_consequence: '' });
        render(true);
      });
    });
    /* Edit from the review. A navigation, not a reset: capture() first so the
       acknowledgements ticked on this step — and every other answer — survive. */
    app.querySelectorAll('[data-hv-edit]').forEach(function (b) {
      b.addEventListener('click', function () {
        capture();
        S.showErrors = false;
        S.returnToReview = true;
        S.step = Number(b.getAttribute('data-hv-edit'));
        saveDraft();
        render();
      });
    });

    /* Back to the review, but only if this step is valid — the required set is
       the server's required set, and skipping past it here would just move the
       failure to the submit button. */
    on('[data-hv-to-review]', function () {
      capture();
      S.showErrors = true;
      if (!validate(S.step)) { render(true); focusFirstError(); return; }
      S.showErrors = false;
      S.returnToReview = false;
      S.step = STEPS.length - 1;
      saveDraft();
      render();
    });

    on('[data-hv-submit]', submit);
  }

  function focusFirstError() {
    var k = Object.keys(S.errors)[0];
    var el = document.getElementById('f-' + k) || document.querySelector('[name="' + k + '"]') || document.querySelector('.hv-error');
    if (el && el.focus) el.focus();
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  async function submit() {
    capture();
    S.showErrors = true;
    if (!validate(5)) { render(true); focusFirstError(); return; }
    /* In demonstration mode nothing may reach a server, ever. */
    if (U.isDemo()) { await U.demoGuard('POST /api/v2/intake'); return; }

    S.sending = true; render(true);
    try {
      var res = await fetch('/api/v2/intake', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload())
      });
      var out = await res.json().catch(function () { return {}; });
      if (!res.ok) { var e = new Error(out.error || 'request_failed'); e.code = out.code; throw e; }
      clearDraft();
      S.result = out; S.view = 'done'; S.sending = false;
      render();
    } catch (e) {
      S.sending = false;
      var f = I.friendlyError(e);
      render(true);
      U.toast(f.message, 6500);
    }
  }

  /* Language switch: capture first, then re-render. Answers survive, the step
     survives, and so does the caret — the focused element is restored by id
     with its selection intact. Errors are re-rendered from their keys, so they
     appear in the language now on screen rather than the one they were made in. */
  /* A language switch re-renders the whole form, which destroys the element the
     visitor was on. Put them back where they were.

     CORRECTED 2026-09-18 (follow-up review). This matched on `activeElement.id`
     only. The one thing that actually triggers a switch is the language button —
     and that button has no id, so nothing was remembered and focus fell to
     <body>. A keyboard user pressing Enter on "English" lost their place in the
     form entirely. The button is now findable by its attribute, so focus returns
     to it. The id/caret path is unchanged and still covers a switch fired while a
     field has focus. */
  I.onChange(function () {
    var active = document.activeElement;
    var focusSel = null;
    if (active) {
      if (active.id) focusSel = '#' + active.id;
      else if (active.hasAttribute && active.hasAttribute('data-hv-lang-toggle')) focusSel = '[data-hv-lang-toggle]';
    }
    var selStart = null, selEnd = null;
    try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (e) {}
    capture();
    render(true);
    if (focusSel) {
      var again = document.querySelector(focusSel);
      if (again) {
        again.focus();
        try { if (selStart !== null && selStart !== undefined) again.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  });

  loadDraft();
  render();
})();
</script>
</body>
</html>
